name: ingest

# Daily pull of every registered dataset. New vintages, revisions and failures
# are committed to the repo (data/, DATA_CHANGELOG.md, registry/status.json,
# logs/runs/). The curator reviews each run's log.

on:
  schedule:
    - cron: "17 5 * * *"      # 05:17 UTC daily (after most overnight European/US releases)
  workflow_dispatch:
    inputs:
      source:
        description: "Limit to one source id (optional)"
        required: false
      dataset:
        description: "Limit to one dataset id (optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Ingest
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          STATSNZ_API_KEY: ${{ secrets.STATSNZ_API_KEY }}
          LABOBS_CONTACT: ${{ vars.LABOBS_CONTACT }}
          LABOBS_DATASET_TIMEOUT: "900"
        run: |
          args=""
          [ -n "${{ inputs.source }}" ] && args="$args --source ${{ inputs.source }}"
          [ -n "${{ inputs.dataset }}" ] && args="$args --dataset ${{ inputs.dataset }}"
          labobs ingest $args
      - name: Commit new vintages
        if: always()
        run: |
          git config user.name "labobs-bot"
          git config user.email "labobs-bot@users.noreply.github.com"
          git add -A data registry/status.json logs DATA_CHANGELOG.md || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: ingest run $(date -u +%F)"
            for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 10; done
          fi
