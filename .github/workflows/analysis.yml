name: analysis

# Re-executes every notebook against the latest vintages and commits the
# rendered outputs, so each notebook on GitHub shows current tables and charts.
# Runs after the daily ingest on Mondays, and on demand.

on:
  workflow_run:
    workflows: [ingest]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analysis
  cancel-in-progress: true

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[analysis]" nbconvert ipykernel
      - name: Check whether any data changed in the last ingest
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ] || git log -1 --format=%s | grep -q "^data:"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Execute notebooks
        if: steps.changed.outputs.run == 'true'
        run: |
          status=0
          for nb in $(find notebooks -name "*.ipynb" | sort); do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute --inplace --allow-errors \
              --ExecutePreprocessor.timeout=600 "$nb" || status=1
            echo "::endgroup::"
          done
          python scripts/notebook_health.py > notebooks/HEALTH.md
          exit 0
      - name: Commit rendered notebooks
        if: steps.changed.outputs.run == 'true'
        run: |
          git config user.name "labobs-bot"
          git config user.email "labobs-bot@users.noreply.github.com"
          git add notebooks
          git diff --cached --quiet || (git commit -m "analysis: re-render notebooks $(date -u +%F)" && git push)
